<section class="panel designer-panel">
  <header class="designer-head">
    <h2 class="section-title">Decision Tree Designer</h2>
    <div class="zoom-controls">
      <button
        type="button"
        class="zoom-btn"
        aria-label="Zoom out"
        [disabled]="!canZoomOut()"
        (click)="zoomOut()"
      >
        <lucide-angular [img]="MinusIcon" size="14" [strokeWidth]="2"></lucide-angular>
      </button>
      <button type="button" class="zoom-value" (click)="resetView()">
        {{ zoomPercent() }}%
      </button>
      <button
        type="button"
        class="zoom-btn"
        aria-label="Zoom in"
        [disabled]="!canZoomIn()"
        (click)="zoomIn()"
      >
        <lucide-angular [img]="PlusIcon" size="14" [strokeWidth]="2"></lucide-angular>
      </button>
      <button
        type="button"
        class="zoom-btn"
        [class.active]="panActive()"
        aria-label="Pan canvas"
        [attr.aria-pressed]="panActive()"
        (click)="togglePan()"
      >
        <lucide-angular [img]="HandIcon" size="14" [strokeWidth]="2"></lucide-angular>
      </button>
      <button type="button" class="zoom-btn" aria-label="Fullscreen" (click)="toggleFullscreen()">
        <lucide-angular [img]="Maximize2Icon" size="14" [strokeWidth]="2"></lucide-angular>
      </button>
    </div>
  </header>

  <div
    #viewport
    class="tree-viewport"
    [class.pan-active]="panActive()"
    [class.is-dragging]="isDragging()"
    (pointerdown)="onViewportPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerCancel($event)"
  >
    <div
      class="tree-canvas-scaler"
      [style.width.px]="scaledWidth()"
      [style.height.px]="scaledHeight()"
    >
      <div
        class="tree-canvas"
        [style.transform]="canvasTransform()"
        [style.width.px]="canvasWidth"
        [style.height.px]="canvasHeight"
      >
        <svg
          class="tree-edges"
          [attr.viewBox]="'0 0 ' + canvasWidth + ' ' + canvasHeight"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          @for (edge of edges(); track edge.fromId + '-' + edge.toId) {
            <path
              [attr.d]="edgePath(edge)"
              [attr.stroke]="edge.branch === 'true' ? 'rgba(45, 212, 191, 0.7)' : 'rgba(248, 113, 113, 0.7)'"
              stroke-width="1.5"
              fill="none"
            />
          }
        </svg>

        @if (nodes().length) {
          <span
            class="root-tag"
            [style.left.px]="nodes()[0].left + nodes()[0].width / 2 - 22"
            [style.top.px]="nodes()[0].top - 22"
          >
            Root
          </span>
        }

        @for (edge of edges(); track edge.fromId + '-' + edge.toId) {
          <span
            class="edge-label"
            [class.coral]="edge.branch === 'false'"
            [style.left.px]="edgeLabelPosition(edge).left"
            [style.top.px]="edgeLabelPosition(edge).top"
          >
            {{ edge.label }}
          </span>
        }

        @for (node of nodes(); track node.id) {
          <button
            type="button"
            class="tree-node"
            [class.decision]="node.type === 'decision'"
            [class.leaf]="node.type === 'leaf'"
            [class.selected]="selectedNodeId() === node.id"
            [class.dragging]="draggingNodeId() === node.id"
            [style.top.px]="node.top"
            [style.left.px]="node.left"
            [style.width.px]="node.width"
            (pointerdown)="onNodePointerDown($event, node.id)"
            (pointermove)="onPointerMove($event)"
            (pointerup)="onPointerUp($event)"
            (pointercancel)="onPointerCancel($event)"
          >
            <span class="node-num">{{ node.id }}</span>
            <span class="node-body">
              <span class="node-title">{{ node.title }}</span>
              @if (node.type === 'leaf') {
                <span class="leaf-badge">
                  <lucide-angular [img]="LeafIcon" size="12" [strokeWidth]="2"></lucide-angular>
                  Leaf
                </span>
              }
            </span>
          </button>
        }
      </div>
    </div>
  </div>
</section>
