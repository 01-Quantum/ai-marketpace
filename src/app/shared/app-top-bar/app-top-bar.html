<header class="top-bar">
  <a routerLink="/landing-page" class="brand brand-link" aria-label="Go to home">
    <img class="brand-logo-img" src="brand-logo.png" alt="Quantum AI Marketplace logo" />
    <div class="brand-text">
      <span class="brand-title">01 Quantum AI Marketplace</span>
      <span class="brand-tag">{{ brandTag() }}</span>
    </div>
  </a>
  <div class="top-bar-right">
    <div class="role-toggle-compact top-bar-role-toggle" role="group" aria-label="Workflow role">
      <button
        type="button"
        class="role-btn-compact"
        [class.active]="activeRole() === 'data'"
        (click)="setRole('data')"
      >
        <lucide-angular [img]="UserIcon" size="16" [strokeWidth]="2"></lucide-angular>
        Data Owner
      </button>
      <button
        type="button"
        class="role-btn-compact alt"
        [class.active]="activeRole() === 'model'"
        (click)="setRole('model')"
      >
        <lucide-angular [img]="LandmarkIcon" size="16" [strokeWidth]="2"></lucide-angular>
        Model Owner
      </button>
    </div>
    <div class="trust-badge">
      <lucide-angular class="trust-badge-icon" [img]="ShieldCheckIcon" size="16"></lucide-angular>
      <span>Secure. Private. Verifiable.</span>
    </div>
    @if (isAuthenticated()) {
      <span class="username">{{ displayName() }}</span>
      <button type="button" class="btn-sign-out" (click)="onSignOut()">Sign Out</button>
      <span class="avatar">
        <lucide-angular [img]="UserIcon" size="20" [strokeWidth]="1.8"></lucide-angular>
      </span>
    }
  </div>
</header>
